name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source bundle
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=sdd-kit/ -o dist/sdd-kit.zip HEAD
          cp install.ps1 dist/install.ps1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/sdd-kit.zip dist/install.ps1 \
            --title "sdd-kit $GITHUB_REF_NAME" \
            --notes "sdd-kit $GITHUB_REF_NAME"
