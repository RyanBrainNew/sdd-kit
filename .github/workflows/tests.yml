name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MCP SDK
        run: python -m pip install -r sdd/mcp/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify core and agent contract
        run: |
          python -m sdd verify-core
          python -m sdd verify-agent
      - name: Check SDD artifacts
        run: python -m sdd check --all --stage ci --check-git
