[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-kit"
version = "0.10.0"
description = "Repository-local SDD workflow, gates and evidence chain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
sdd = "sdd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdd*"]
namespaces = true

[tool.setuptools.package-data]
sdd = [
  "VERSION",
  "agent-block.md",
  "agent-contract.md",
  "config.json",
  "manifest.json",
  "README.md",
  "templates/*",
  "workflows/*",
  "prompts/*",
  "prompts/review/*",
  "hooks/*",
  "ci/*",
  "scripts/*",
  "context/*",
  "context/*/*",
  "context/contracts/.gitkeep",
  "context/services/.gitkeep",
  "mcp/*",
]
